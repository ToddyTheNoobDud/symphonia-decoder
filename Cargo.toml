
[package]
authors = ["ToddyTheNoobDud"]
edition = "2024"
name = "toddy_decoder"
version = "2.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.2", features = ["async"] }
napi-derive = "3.7.1"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = "0.3.0"
rubato = "5.1.0"

# The GCC 4.8 CI toolchains cannot build Opus NEON on ARM and enable
# AVX2 without the SSE4.1 declarations on Linux x64 GNU.
[target.'cfg(any(target_arch = "aarch64", target_arch = "arm"))'.dependencies]
opusic-sys = { version = "0.7.7", features = ["no-simd"] }

[target.x86_64-unknown-linux-gnu.dependencies]
opusic-sys = { version = "0.7.7", features = ["no-simd"] }

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
strip = "symbols"
