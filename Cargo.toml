
[package]
authors = ["ToddyTheNoobDud"]
edition = "2024"
name = "toddy_decoder"
version = "2.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.12.1"
napi-derive = "3.6.3"
symphonia = { version = "0.6.1", features = ["all"] }
rubato = "5.0.0"

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = "symbols"
